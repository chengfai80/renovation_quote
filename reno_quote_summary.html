      if(it.ibina){const cls=it.ibina.amt===minAmt&&amts.length>1?'lowest':'';h+=`<td>${it.ibina.qty} ${it.ibina.unit}</td><td>${fmt(it.ibina.price)}</td><td class="${cls}">${fmt(it.ibina.amt)}${it.ibina.note?'<br><span style="color:#555;font-size:9px">'+it.ibina.note+'</span>':''}</td>`;}
      else h+='<td class="na">-</td><td class="na">-</td><td class="na">-</td>';
      if(it.movein){const cls=it.movein.amt===minAmt&&amts.length>1?'lowest':'';h+=`<td>${it.movein.qty} ${it.movein.unit}</td><td>${fmt(it.movein.price)}</td><td class="${cls}">${fmt(it.movein.amt)}${it.movein.note?'<br><span style="color:#555;font-size:9px">'+it.movein.note+'</span>':''}</td>`;}
      else h+='<td class="na">-</td><td class="na">-</td><td class="na">-</td>';
      h+=`<td>${getItemBadge(it)}</td></tr>`;
    });
  });
  h+='</tbody></table></div></div>';
  document.getElementById('detail-section').innerHTML=h;
}
function getBestBadge(h,i,m){
  const vals=[{v:h,n:'Hulse',c:'badge-h'},{v:i,n:'IBINA',c:'badge-i'},{v:m,n:'MoveIn',c:'badge-m'}].filter(x=>x.v>0);
  if(!vals.length)return'';vals.sort((a,b)=>a.v-b.v);
  return`<span class="badge ${vals[0].c}">${vals[0].n}</span>`;
}
function getItemBadge(it){
  const entries=[];
  if(it.hulse&&it.hulse.amt>=0)entries.push({v:it.hulse.amt,n:'Hulse',c:'badge-h'});
  if(it.ibina&&it.ibina.amt>=0)entries.push({v:it.ibina.amt,n:'IBINA',c:'badge-i'});
  if(it.movein&&it.movein.amt>=0)entries.push({v:it.movein.amt,n:'MoveIn',c:'badge-m'});
  if(entries.length<2)return entries.length?`<span class="badge badge-tie">${entries[0].n} only</span>`:'';
  entries.sort((a,b)=>a.v-b.v);
  if(entries[0].v===entries[1].v)return'<span class="badge badge-tie">Tied</span>';
  return`<span class="badge ${entries[0].c}">${entries[0].n}</span>`;
}
